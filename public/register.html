<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | CareerGuide</title>
    <link rel="stylesheet" href="register.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav class="navbar">
      <div class="logo">CareerCounselling</div>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="indexfeature.html">Students</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="resources.html">Resources</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="faq.html">FAQs</a></li>
        <li class="auth-btns" id="loginNav">
          <a href="login.html" class="login-btn">Login</a>
        </li>
        <li class="auth-btns" id="signupNav">
          <a href="register.html" class="signup-btn">Sign Up</a>
        </li>
      </ul>
      <div class="menu-icon" id="menuToggle">☰</div>
    </nav>

    <div class="bg-animated"></div>
    <div class="register-container">
      <div class="register-card">
        <h2>🎉 Create Your Account</h2>
        <p>
          Join <span class="brand">Career<span>Guide</span></span> and unlock
          your career potential 🚀
        </p>

        <form id="registerForm" autocomplete="off">
          <div class="form-group">
            <label for="fullname">Full Name</label>
            <input
              type="text"
              id="fullname"
              class="form-control"
              placeholder="Enter your full name"
              required
            />
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <input
              type="email"
              id="email"
              class="form-control"
              placeholder="Enter your email"
              required
            />
          </div>

          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input
              type="text"
              id="phone"
              class="form-control"
              placeholder="Enter your phone number"
              required
            />
          </div>

          <div class="form-group">
            <label>I am a:</label>
            <div class="role-selector">
              <div class="role-option">
                <input
                  type="radio"
                  id="user-role"
                  name="role"
                  value="user"
                  checked
                />
                <label for="user-role">Student</label>
              </div>
              <div class="role-option">
                <input
                  type="radio"
                  id="counselor-role"
                  name="role"
                  value="counselor"
                />
                <label for="counselor-role">Career Counselor</label>
              </div>
            </div>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              class="form-control"
              placeholder="Create a password"
              required
            />
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input
              type="password"
              id="confirmPassword"
              class="form-control"
              placeholder="Re-enter your password"
              required
            />
          </div>

          <button type="submit" class="btn-primary">Continue 🚀</button>

          <div class="login-link">
            Already have an account? <a href="login.html">Sign in</a>
          </div>
        </form>
      </div>
    </div>
    <script src="register.js"></script>
  </body>
</html>
