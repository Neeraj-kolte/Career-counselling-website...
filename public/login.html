<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login | CareerGuide</title>
    <link rel="stylesheet" href="login.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav class="navbar">
      <div class="logo">CareerCounselling</div>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="indexfeature.html">Students</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="resources.html">Resources</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="faq.html">FAQs</a></li>
        <li class="auth-btns" id="loginNav">
          <a href="login.html" class="login-btn">Login</a>
        </li>
        <li class="auth-btns" id="signupNav">
          <a href="register.html" class="signup-btn">Sign Up</a>
        </li>
      </ul>
      <div class="menu-icon" id="menuToggle">☰</div>
    </nav>

    <div class="bg-animated"></div>
    <div class="login-container">
      <form class="login-card" id="login-form" autocomplete="off">
        <h2>👋 Welcome Back!</h2>
        <p>
          Login to <span class="brand">Career<span>Guide</span></span> and
          unlock your future 🚀
        </p>

        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        />

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          required
        />

        <button type="submit">
          <span>🔓 Login</span>
        </button>

        <div class="divider"><span>or</span></div>

        <p class="register-link">
          Don't have an account? <a href="register.html">Register here</a>
        </p>
      </form>
    </div>
    <script src="login.js"></script>
  </body>
</html>
